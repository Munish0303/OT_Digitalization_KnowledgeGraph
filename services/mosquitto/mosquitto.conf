# DMZ broker (Purdue level 3.5). Demo only: anonymous and plain TCP.
# Production: TLS (listener 8883 + certfile/keyfile), per-client certificates and ACLs
# (edge may only publish givaudan/#, ingest may only subscribe).
listener 1883
allow_anonymous true
persistence false
max_queued_messages 0
max_inflight_messages 100
